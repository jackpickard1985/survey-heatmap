<!DOCTYPE html>
<html>
  <head>
    <title>Postcode Heatmap</title>

    <!-- Papaparse for CSV parsing -->
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

    <style>
      #map {
        height: 100vh;
        width: 100%;
      }
      #controls {
        position: absolute;
        top: 10px;
        left: 10px;
        background: white;
        padding: 10px;
        z-index: 999;
        border-radius: 6px;
      }
    </style>
  </head>

  <body>
    <div id="controls">
      <label>Select issue:</label>
      <select id="issueSelect" onchange="changeLayer()"></select>
    </div>

    <div id="map"></div>

    <script>
      let map;
      let heatmaps = {};

      // Your 7 issues mapped to CSV column names
      let issues = [
        { key: "Dirty streets", label: "Dirty streets" },
        { key: "Drug use", label: "Drug use" },
        { key: "Council property upkeep", label: "Council property upkeep" },
        { key: "Phone theft", label: "Phone theft" },
        { key: "Public amenities", label: "Public amenities" },
        { key: "Universal credit", label: "Universal credit" },
        { key: "Access to healthcare", label: "Access to healthcare" }
      ];

      async function initMap() {
        map = new google.maps.Map(document.getElementById("map"), {
          zoom: 10,
          center: { lat: 51.5074, lng: -0.1278 } // London
        });

        populateDropdown();

        const sheetData = await loadSheetData();
        const geocoded = await geocodePostcodes(sheetData);

        // Create heatmap layers for each issue
        
        issues.forEach(issue => {
          heatmaps[issue.key] = new google.maps.visualization.HeatmapLayer({
            data: geocoded
              .filter(row => Number(row[issue.key]) >= 1)
              .map(row => new google.maps.LatLng(row.lat, row.lng)),
            radius: 20,
            map: null,
          });
        });

        // Show the first issue by default
        changeLayer();
      }

      function populateDropdown() {
        const select = document.getElementById("issueSelect");
        issues.forEach(issue => {
          const opt = document.createElement("option");
          opt.value = issue.key;
          opt.textContent = issue.label;
          select.appendChild(opt);
        });
      }

      function changeLayer() {
        const selected = document.getElementById("issueSelect").value;

        // Hide all layers
        Object.values(heatmaps).forEach(layer => layer.setMap(null));

        // Show selected layer
        if (heatmaps[selected]) {
          heatmaps[selected].setMap(map);
        }
      }

      async function loadSheetData() {
        return new Promise(resolve => {
          Papa.parse(
            "https://docs.google.com/spreadsheets/d/e/2PACX-1vSsaBrKC2Rd2oOXKXCkiIuhewM1Xb2UalfSasNY4GdbqcCql9P1bxQR_SivcZljkepqGxg_HPOhES_-/pub?gid=1431217891&single=true&output=csv",
            {
              download: true,
              header: true,
              complete: results => resolve(results.data)
            }
          );
        });
      }

      async function geocodePostcodes(rows) {
        const geocoder = new google.maps.Geocoder();
        const results = [];

        for (const row of rows) {
          if (!row.postcode) continue;

          try {
            const cleanedPostcode = String(row.postcode || "")
              .replace(/\s+/g, " ")
              .trim()
              .toUpperCase();

            const geo = await geocoder.geocode({
              address: cleanedPostcode + ", London, UK"
            });
            if (geo.results.length > 0) {
              const loc = geo.results[0].geometry.location;
              results.push({
                ...row,
                lat: loc.lat(),
                lng: loc.lng()
              });
            }
          } catch (e) {
            console.warn("Failed to geocode:", row.postcode);
          }
        }

        return results;
      }
    </script>

    <!-- Google Maps API -->
    <script async
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCEUeDbFLEalG-_k9YXr84bVtsbwz6cXA4&libraries=visualization&callback=initMap">
    </script>

  </body>
</html>
