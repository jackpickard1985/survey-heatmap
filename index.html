<!DOCTYPE html>
<html>
  <head>
    <title>Postcode Heatmap</title>

    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

    <style>
      body {
        margin: 0;
        padding: 0;
        display: flex;
        height: 100vh;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }

      /* ⭐ Left sidebar */
      #sidebar {
        width: 280px;
        background: #ffffff;
        border-right: 1px solid #ccc;
        padding: 15px;
        box-shadow: 2px 0 8px rgba(0,0,0,0.15);
        z-index: 1000;
        overflow-y: auto;
      }

      #map {
        flex: 1;
      }

      #controls {
        background: #f7f7f7;
        padding: 10px;
        border-radius: 6px;
        margin-bottom: 20px;
        box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      }

      #legend {
        background: #f7f7f7;
        padding: 10px;
        border-radius: 6px;
        margin-top: 20px;
        box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      }

      #legend .box {
        display: inline-block;
        width: 20px;
        height: 12px;
        margin-right: 6px;
      }

      /* ⭐ Stats panel inside sidebar */
      #statsPanel {
        margin-top: 20px;
        background: #f7f7f7;
        padding: 12px;
        border-radius: 6px;
        box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      }

      #statsPanel strong {
        font-size: 17px;
        display: block;
        margin-bottom: 8px;
      }

      #statsPanel hr {
        margin: 10px 0;
      }

      #loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(255,255,255,0.9);
        padding: 20px 30px;
        border-radius: 8px;
        font-size: 18px;
        z-index: 2000;
      }
    </style>
  </head>

  <body>

    <!-- ⭐ Left sidebar -->
    <div id="sidebar">

      <div id="controls">
        <label>Select issue:</label>
        <select id="issueSelect" onchange="changeLayer()"></select>

        <br><br>

        <label>
          <input type="checkbox" id="togglePoints" onchange="togglePointsMode()">
          Show points instead of heatmap
        </label>
      </div>

      <div id="legend">
        <strong>Heatmap intensity</strong><br>
        <div><span class="box" style="background: rgba(0,128,255,0.6)"></span> Low severity</div>
        <div><span class="box" style="background: rgba(0,255,0,0.8)"></span> Medium severity</div>
        <div><span class="box" style="background: rgba(255,0,0,1)"></span> High severity</div>
      </div>

      <!-- ⭐ Stats panel -->
      <div id="statsPanel"></div>

    </div>

    <div id="map"></div>

    <div id="loading">Loading map data…</div>

    <script>
      let map;
      let heatmaps = {};
      let markers = [];

      const issues = [
        { key: "Dirty streets", label: "Dirty streets" },
        { key: "Drug use", label: "Drug use" },
        { key: "Council property upkeep", label: "Council property upkeep" },
        { key: "Phone theft", label: "Phone theft" },
        { key: "Public amenities", label: "Public amenities" },
        { key: "Universal credit", label: "Universal credit" },
        { key: "Access to healthcare", label: "Access to healthcare" }
      ];

      async function initMap() {
        map = new google.maps.Map(document.getElementById("map"), {
          zoom: 15,
          center: { lat: 51.5450, lng: 0.0240 }
        });

        populateDropdown();

        const sheetData = await loadSheetData();
        const geocoded = await geocodePostcodes(sheetData);

        const softGradient = [
          "rgba(0, 0, 0, 0)",
          "rgba(0, 128, 255, 0.6)",
          "rgba(0, 255, 255, 0.7)",
          "rgba(0, 255, 0, 0.8)",
          "rgba(255, 255, 0, 0.9)",
          "rgba(255, 128, 0, 1)",
          "rgba(255, 0, 0, 1)"
        ];

        issues.forEach(issue => {
          heatmaps[issue.key] = new google.maps.visualization.HeatmapLayer({
            data: geocoded
              .filter(row => Number(row[issue.key]) >= 1) // ⭐ include 1s
              .map(row => ({
                location: new google.maps.LatLng(row.lat, row.lng),
                weight: Number(row[issue.key]) * 20
              })),
            gradient: softGradient,
            radius: 60,
            map: null
          });
        });

        document.getElementById("loading").style.display = "none";
        changeLayer();
      }

      function populateDropdown() {
        const select = document.getElementById("issueSelect");
        issues.forEach(issue => {
          const opt = document.createElement("option");
          opt.value = issue.key;
          opt.textContent = issue.label;
          select.appendChild(opt);
        });
      }

      function changeLayer() {
        const selected = document.getElementById("issueSelect").value;
        const showPoints = document.getElementById("togglePoints").checked;

        Object.values(heatmaps).forEach(layer => layer.setMap(null));
        markers.forEach(m => m.setMap(null));
        markers = [];

        if (showPoints) {
          togglePointsMode();
        } else {
          heatmaps[selected].setMap(map);
        }

        updateStats(selected);
      }

      function togglePointsMode() {
        const showPoints = document.getElementById("togglePoints").checked;
        const selected = document.getElementById("issueSelect").value;

        Object.values(heatmaps).forEach(h => h.setMap(null));
        markers.forEach(m => m.setMap(null));
        markers = [];

        if (showPoints) {
          const data = heatmaps[selected].getData().getArray();
          data.forEach(item => {
            const marker = new google.maps.Marker({
              position: item.location,
              map: map
            });
            markers.push(marker);
          });
        } else {
          heatmaps[selected].setMap(map);
        }
      }

      /* ⭐ Updated stats function: includes 1s, removes min/max */
      function updateStats(issueKey) {
        const panel = document.getElementById("statsPanel");

        const data = heatmaps[issueKey].getData().getArray();
        const scores = data.map(p => p.weight / 20);

        const count = scores.length;
        const avg = count ? (scores.reduce((a,b)=>a+b,0) / count).toFixed(2) : "N/A";

        const count4 = scores.filter(s => s === 4).length;
        const count3 = scores.filter(s => s === 3).length;
        const count2 = scores.filter(s => s === 2).length;
        const count1 = scores.filter(s => s === 1).length;

        panel.innerHTML = `
          <strong>${issueKey}</strong>
          <div><b>Total postcodes rated 1–4:</b> ${count}</div>
          <div><b>Average score:</b> ${avg}</div>
          <hr>
          <div><b>Score 4 (high concern):</b> ${count4}</div>
          <div><b>Score 3 (moderate concern):</b> ${count3}</div>
          <div><b>Score 2 (low concern):</b> ${count2}</div>
          <div><b>Score 1 (very low concern):</b> ${count1}</div>
        `;
      }

      async function loadSheetData() {
        return new Promise(resolve => {
          Papa.parse(
            "https://docs.google.com/spreadsheets/d/e/2PACX-1vSsaBrKC2Rd2oOXKXCkiIuhewM1Xb2UalfSasNY4GdbqcCql9P1bxQR_SivcZljkepqGxg_HPOhES_-/pub?gid=1431217891&single=true&output=csv",
            {
              download: true,
              header: true,
              complete: results => resolve(results.data)
            }
          );
        });
      }

      async function geocodePostcodes(rows) {
        const geocoder = new google.maps.Geocoder();
        const results = [];
        const queue = [...rows];
        const concurrency = 5;

        async function worker() {
          while (queue.length) {
            const row = queue.shift();
            if (!row.postcode) continue;

            const cleaned = String(row.postcode).trim().toUpperCase();

            try {
              const geo = await geocoder.geocode({
                address: `${cleaned}, London, UK`
              });

              if (geo.results.length > 0) {
                const loc = geo.results[0].geometry.location;
                results.push({
                  ...row,
                  lat: loc.lat(),
                  lng: loc.lng()
                });
              }
            } catch (e) {
              console.warn("Failed:", cleaned);
            }
          }
        }

        await Promise.all(Array(concurrency).fill().map(worker));
        return results;
      }
    </script>

    <script async
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCEUeDbFLEalG-_k9YXr84bVtsbwz6cXA4&libraries=visualization&callback=initMap">
    </script>

  </body>
</html>
