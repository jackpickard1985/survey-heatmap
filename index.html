<!DOCTYPE html>
<html>
  <head>
    <title>Postcode Heatmap</title>

    <!-- Papaparse for CSV parsing -->
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

    <style>
      #map {
        height: 100vh;
        width: 100%;
      }
      #controls {
        position: absolute;
        top: 10px;
        left: 10px;
        background: white;
        padding: 10px;
        z-index: 999;
        border-radius: 6px;
      }
      #loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(255,255,255,0.9);
        padding: 20px 30px;
        border-radius: 8px;
        font-size: 18px;
        z-index: 2000;
      }
    </style>
  </head>

  <body>
    <div id="loading">Loading map data…</div>

    <div id="controls">
      <label>Select issue:</label>
      <select id="issueSelect" onchange="changeLayer()"></select>
    </div>

    <div id="map"></div>

    <script>
      let map;
      let heatmaps = {};

      const issues = [
        { key: "Dirty streets", label: "Dirty streets" },
        { key: "Drug use", label: "Drug use" },
        { key: "Council property upkeep", label: "Council property upkeep" },
        { key: "Phone theft", label: "Phone theft" },
        { key: "Public amenities", label: "Public amenities" },
        { key: "Universal credit", label: "Universal credit" },
        { key: "Access to healthcare", label: "Access to healthcare" }
      ];

      async function initMap() {
        map = new google.maps.Map(document.getElementById("map"), {
          zoom: 16,
          center: { lat: 51.5400, lng: 0.0240 }
        });

        populateDropdown();

        const sheetData = await loadSheetData();
        const geocoded = await geocodePostcodes(sheetData);

        const softGradient = [
          "rgba(0, 0, 0, 0)",
          "rgba(0, 128, 255, 0.6)",
          "rgba(0, 255, 255, 0.7)",
          "rgba(0, 255, 0, 0.8)",
          "rgba(255, 255, 0, 0.9)",
          "rgba(255, 128, 0, 1)",
          "rgba(255, 0, 0, 1)"
        ];

        issues.forEach(issue => {
          heatmaps[issue.key] = new google.maps.visualization.HeatmapLayer({
            data: geocoded
              .filter(row => Number(row[issue.key]) >= 2)
              .map(row => ({
                location: new google.maps.LatLng(row.lat, row.lng),
                weight: Number(row[issue.key]) * 20
              })),
            gradient: softGradient,
            radius: 60,
            map: null
          });
        });

        document.getElementById("loading").style.display = "none";
        changeLayer();
      }

      function populateDropdown() {
        const select = document.getElementById("issueSelect");
        issues.forEach(issue => {
          const opt = document.createElement("option");
          opt.value = issue.key;
          opt.textContent = issue.label;
          select.appendChild(opt);
        });
      }

      function changeLayer() {
        const selected = document.getElementById("issueSelect").value;
        Object.values(heatmaps).forEach(layer => layer.setMap(null));
        if (heatmaps[selected]) heatmaps[selected].setMap(map);
      }

      async function loadSheetData() {
        return new Promise(resolve => {
          Papa.parse(
            "https://docs.google.com/spreadsheets/d/e/2PACX-1vSsaBrKC2Rd2oOXKXCkiIuhewM1Xb2UalfSasNY4GdbqcCql9P1bxQR_SivcZljkepqGxg_HPOhES_-/pub?gid=1431217891&single=true&output=csv",
            {
              download: true,
              header: true,
              complete: results => resolve(results.data)
            }
          );
        });
      }

      // Parallel geocoding
      async function geocodePostcodes(rows) {
        const geocoder = new google.maps.Geocoder();
        const results = [];
        const queue = [...rows];
        const concurrency = 5;

        async function worker() {
          while (queue.length) {
            const row = queue.shift();
            if (!row.postcode) continue;

            const cleaned = String(row.postcode).trim().toUpperCase();

            try {
              const geo = await geocoder.geocode({
                address: `${cleaned}, London, UK`
              });

              if (geo.results.length > 0) {
                const loc = geo.results[0].geometry.location;
                results.push({
                  ...row,
                  lat: loc.lat(),
                  lng: loc.lng()
                });
              }
            } catch (e) {
              console.warn("Failed:", cleaned);
            }
          }
        }

        await Promise.all(Array(concurrency).fill().map(worker));
        return results;
      }
    </script>

    <script async
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCEUeDbFLEalG-_k9YXr84bVtsbwz6cXA4&libraries=visualization&callback=initMap">
    </script>

  </body>
</html>
