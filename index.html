<!DOCTYPE html>
<html>
  <head>
    <title>Postcode Heatmap from Google Sheets CSV</title>

    <!-- Papaparse for CSV parsing -->
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

    <style>
      #map {
        height: 100vh;
        width: 100%;
      }
      #controls {
        position: absolute;
        top: 10px;
        left: 10px;
        background: white;
        padding: 10px;
        z-index: 999;
        border-radius: 6px;
      }
    </style>
  </head>

  <body>
    <div id="controls">
      <label>Select issue:</label>
      <select id="issueSelect" onchange="changeLayer()"></select>
    </div>

    <div id="map"></div>

    <script>
      let map;
      let heatmaps = {};

      // Your 7 issues mapped to CSV column names
      let issues = [
        { key: "dirty_streets", label: "Dirty streets" },
        { key: "drug_use", label: "Drug use" },
        { key: "council_upkeep", label: "Council property upkeep" },
        { key: "phone_theft", label: "Phone theft" },
        { key: "public_amenities", label: "Public amenities" },
        { key: "universal_credit", label: "Universal credit" },
        { key: "healthcare_access", label: "Access to healthcare" }
      ];

      async function initMap() {
        map = new google.maps.Map(document.getElementById("map"), {
          zoom: 10,
          center: { lat: 51.5074, lng: -0.1278 } // London
        });

        populateDropdown();

        const sheetData = await loadSheetData();
        const geocoded = await geocodePostcodes(sheetData);

        // Create heatmap layers for each issue
        issues.forEach(issue => {
          heatmaps[issue.key] = new google.maps.visualization.HeatmapLayer({
            data: geocoded
              .filter(row => row[issue.key] === "1")
              .map(row => new google.maps.LatLng(row.lat, row.lng)),
            map: null,
            radius: 25
          });
        });

        // Show the first issue by default
        changeLayer();
      }
